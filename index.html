    const wrap = (title, body, foot) =>
      '<div class="mask" data-act="closeModal"></div><div class="sheet">' +
      '<div class="sheet-head"><span class="t">' + esc(title) + '</span><span class="x" data-act="closeModal">关闭</span></div>' +
      body + '<div class="sheet-foot">' + foot + '</div></div>';

    if (m.type === 'confirm') {
      return '<div class="mask" data-act="closeModal"></div><div class="confirm-box">' +
        '<div class="t">' + esc(m.title) + '</div><div class="d">' + esc(m.text) + '</div>' +
        '<div class="confirm-actions"><div class="c" data-act="closeModal">取消</div>' +
        '<div class="c ' + (m.danger ? 'danger' : 'main') + '" data-act="confirmYes">' + esc(m.confirmText || '确定') + '</div></div></div>';
    }

    if (m.type === 'split') {
      const d = state.draft;
      const parts = splitParts();
      let selectedIndex = 0;
      const rows = d.splits.map((s, i) => {
        const p = perOf(s.person_id);
        let amountText = '—';
        if (parts) {
          if (s.checked) { amountText = yuan(parts[selectedIndex + 1]); selectedIndex += 1; }
        }
        return '<div class="split-row"><div class="check ' + (s.checked ? 'on' : '') + '" data-act="splitToggle" data-index="' + i + '">✓</div>' +
          '<div class="sn">' + esc(p.name) + '</div>' +
          '<div class="stepper"><div class="b" data-act="splitShares" data-index="' + i + '" data-delta="-1">−</div>' +
          '<span class="v">' + s.shares + '</span>' +
          '<div class="b" data-act="splitShares" data-index="' + i + '" data-delta="1">+</div></div>' +
          '<div class="sa num">' + amountText + '</div></div>';
      }).join('');
      const mineText = parts ? yuan(parts[0]) : yuan(safeParse(d.amountText));
      return '<div class="mask" data-act="closeModal"></div><div class="sheet">' +
        '<div class="sheet-head"><span class="t">多人分摊</span><span class="x" data-act="closeModal">关闭</span></div>' +
        '<div class="sheet-note">按份数均分，除不尽的余数给非付款人，我承担 floor 值。我的份额 ' + mineText + '</div>' +
        '<div class="sheet-body">' + (d.splits.length ? rows : '<div class="empty-inline">还没有往来对象，先到「我的 - 往来」添加</div>') + '</div>' +
        '<div class="sheet-foot"><div class="btn primary" data-act="closeModal">完成</div></div></div>';
    }

    if (m.type === 'account') {
      const f = m.form;
      return wrap(f.id ? '编辑账户' : '新增账户',
        '<div class="sheet-body">' +
        '<div class="field field-row"><span class="field-label">名称</span><input class="txt" id="f-name" maxlength="10" placeholder="如：工资卡" value="' + esc(f.name) + '"></div>' +
        '<div class="line"></div><div class="field field-row"><span class="field-label">类型</span>' +
        '<select class="sel" id="f-type">' + ACCOUNT_TYPE_OPTIONS.map(o =>
          '<option value="' + o[0] + '"' + (o[0] === f.type ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></div>' +
        '<div class="line"></div><div class="field field-row"><span class="field-label">初始余额</span>' +
        '<input class="txt" id="f-initial" inputmode="decimal" placeholder="0.00，信用卡可填负数" value="' + esc(f.initial) + '"></div>' +
        '<div class="line"></div><div class="field field-row"><span class="field-label">排序</span>' +
        '<input class="txt" id="f-sort" inputmode="numeric" value="' + esc(f.sort) + '"></div>' +
        '<div class="line"></div><div class="field field-row"><span class="field-label">归档</span>' +
        '<div class="switch ' + (f.archived ? 'on' : '') + '" data-act="formArchived"><div class="knob"></div></div></div>' +
        '</div>',
        '<div class="btn primary" data-act="saveAccount">保存</div>');
    }

    if (m.type === 'category') {
      const f = m.form;
      return wrap(f.id ? '编辑分类' : '新增分类',
        '<div class="sheet-body">' +
        '<div class="field field-row"><span class="field-label">名称</span><input class="txt" id="f-name" maxlength="8" placeholder="如：宠物" value="' + esc(f.name) + '"></div>' +
        '<div class="line"></div><div class="field field-row"><span class="field-label">图标</span>' +
        '<input class="txt" id="f-icon" maxlength="4" value="' + esc(f.icon) + '" placeholder="一个 emoji"></div>' +
        '<div class="line"></div><div class="field field-row"><span class="field-label">排序</span>' +
        '<input class="txt" id="f-sort" inputmode="numeric" value="' + esc(f.sort) + '"></div>' +
        (f.isSystem ? '' : '<div class="line"></div><div class="field field-row"><span class="field-label">归档</span>' +
          '<div class="switch ' + (f.archived ? 'on' : '') + '" data-act="formArchived"><div class="knob"></div></div></div>') +
        '</div>',
        '<div class="btn primary" data-act="saveCategory">保存</div>');
    }

    if (m.type === 'person') {
      const f = m.form;
      return wrap(f.id ? '编辑对象' : '新增对象',
        '<div class="sheet-body">' +
        '<div class="field field-row"><span class="field-label">姓名</span><input class="txt" id="f-name" maxlength="12" placeholder="如：小王" value="' + esc(f.name) + '"></div>' +
        '<div class="line"></div><div class="field field-row"><span class="field-label">关系</span>' +
        '<select class="sel" id="f-kind">' + PERSON_KIND_OPTIONS.map(o =>
          '<option value="' + o[0] + '"' + (o[0] === f.kind ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></div>' +
        '<div class="line"></div><div class="field field-row"><span class="field-label">备注</span>' +
        '<input class="txt" id="f-note" maxlength="30" placeholder="可选" value="' + esc(f.note) + '"></div>' +
        '<div class="line"></div><div class="field field-row"><span class="field-label">归档</span>' +
        '<div class="switch ' + (f.archived ? 'on' : '') + '" data-act="formArchived"><div class="knob"></div></div></div>' +
        '</div>',
        '<div class="btn primary" data-act="savePerson">保存</div>');
    }

    if (m.type === 'settle') {
      const f = m.form;
      return wrap(f.title,
        '<div class="sheet-body">' +
        '<div class="field field-row"><span class="field-label">金额</span>' +
        '<input class="txt" id="f-amount" inputmode="decimal" value="' + esc(f.amount) + '"></div>' +
        '<div class="line"></div><div class="field field-row"><span class="field-label">方向</span>' +
        '<span style="font-size:12px;color:#4E5969">' + (f.direction === 'in' ? '钱进来（对方还款 / 报销到账）' : '钱出去（我还款 / 我垫付）') + '</span></div>' +
        '<div class="line"></div><div class="field field-row"><span class="field-label">账户</span>' +
        '<select class="sel" id="f-account">' + visibleAccounts().map(a =>
          '<option value="' + a.id + '">' + esc(a.name) + '</option>').join('') + '</select></div>' +
        '<div class="line"></div><div class="field field-row"><span class="field-label">日期</span>' +
        '<input class="txt" type="date" id="f-date" value="' + f.date + '"></div>' +
        '<div class="line"></div><div class="field field-row"><span class="field-label">备注</span>' +
        '<input class="txt" id="f-note" maxlength="50" placeholder="可选" value="' + esc(f.note) + '"></div>' +
        '</div>',
        '<div class="btn primary" data-act="saveSettle">' + esc(f.confirmText || '确认结算') + '</div>');
    }

    if (m.type === 'budget') {
      const f = m.form;
      return wrap('设置预算',
        '<div class="sheet-body">' +
        '<div class="field field-row"><span class="field-label">预算对象</span>' +
        '<select class="sel" id="f-target"><option value="">总预算</option>' +
        catsOf('expense').map(c => '<option value="' + c.id + '">' + esc(c.name) + '</option>').join('') + '</select></div>' +
        '<div class="line"></div><div class="field field-row"><span class="field-label">预算金额</span>' +
        '<input class="txt" id="f-amount" inputmode="decimal" placeholder="0.00" value="' + esc(f.amount) + '"></div>' +
        '</div>',
        '<div class="btn primary" data-act="saveBudget">保存</div>');
    }
    return '';
  }

  const ACCOUNT_TYPE_OPTIONS = [['cash', '现金'], ['wechat', '微信'], ['alipay', '支付宝'], ['bank', '银行卡'], ['credit', '信用卡']];
  const PERSON_KIND_OPTIONS = [['family', '家人'], ['colleague', '同事'], ['friend', '朋友'], ['company', '公司']];

  // ========== 交互 ==========
  function openModal(type, extra) {
    state.modal = Object.assign({ type }, extra || {});
    render();
  }
  function closeModal() {
    state.modal = null;
    render();
  }
  function confirmAction(title, text, fn, danger) {
    state.pendingConfirm = fn;
    openModal('confirm', { title, text, danger: !!danger, confirmText: danger ? '删除' : '确定' });
  }

  const handlers = {
    back() {
      if (state.view === 'record' && state.draft && state.draft.id) { go('detail', { id: state.draft.id }); return; }
      history.back();
    },
    tab(el) { go(el.dataset.view); },
    nav(el) { go(el.dataset.view, { type: el.dataset.type }); },
    openSearch() {
      state.kw = '';
      state.searchType = 'all';
      state.focusSearch = true;
      go('search');
    },
    clearKw() {
      state.kw = '';
      render();
      const q = document.getElementById('q');
      if (q) q.focus();
    },
    searchScope(el) {
      state.searchType = el.dataset.type;
      render();
    },
    catDetail(el) {
      go('category', { id: el.dataset.id, type: el.dataset.type });
    },
    month(el) {
      state.period = shiftPeriod(state.period, Number(el.dataset.delta));
      render();
    },
    statsMode(el) { state.statsMode = el.dataset.mode; render(); },
    statsPeriod(el) {
      if (state.statsMode === 'month') {
        state.period = shiftPeriod(state.period, Number(el.dataset.delta));
      } else {
        const y = Number(state.period.slice(0, 4)) + Number(el.dataset.delta);
        state.period = y + '-' + state.period.slice(5);
      }
      render();
    },
    detail(el) { go('detail', { id: el.dataset.id }); },
    editTxn(el) { go('record', { id: el.dataset.id }); },

    setType(el) {
      const d = state.draft;
      if (d.type === el.dataset.type) return;
      d.type = el.dataset.type;
      const cats = catsOf(d.type);
      d.categoryId = cats[0] ? cats[0].id : '';
      d.reimburse = false;
      render();
    },
    setCategory(el) { state.draft.categoryId = el.dataset.id; render(); },
    setAccount(el) { state.draft.accountId = el.dataset.id; render(); },
    toggleReimburse() {
      const d = state.draft;
      d.reimburse = !d.reimburse;
      if (d.reimburse && !d.personId) d.personId = activePersons()[0] ? activePersons()[0].id : '';
      render();
    },
    openSplit() { openModal('split'); },
    splitToggle(el) {
      const i = Number(el.dataset.index);
      state.draft.splits[i].checked = !state.draft.splits[i].checked;
      render();
    },
    splitShares(el) {
      const i = Number(el.dataset.index);
      const d = state.draft.splits[i];
      d.shares = Math.min(20, Math.max(1, d.shares + Number(el.dataset.delta)));
      render();
    },
    key(el) {
      const d = state.draft;
      let text = d.amountText || '';
      const k = el.dataset.key;
      if (k === 'back') { d.amountText = text.slice(0, -1); render(); return; }
      if (k === '.') {
        if (text.indexOf('.') >= 0) return;
        d.amountText = (text || '0') + '.';
        render();
        return;
      }
      const parts = text.split('.');
      if (parts.length === 2 && parts[1].length >= 2) return;
      if (parts.length === 1 && parts[0].length >= 5) return;
      d.amountText = (text + k).replace(/^0+(\d)/, '$1');
      render();
    },
    saveTxn() { saveTxn(); },
    deleteTxn(el) {
      const id = el.dataset.id;
      const t0 = db.txns.find(x => x.id === id);
      const repayCount = (t0 && (t0.type === 'loan_out' || t0.type === 'loan_in'))
        ? db.settlements.filter(s => s.txn_id === id && !s.deleted_at).length : 0;
      confirmAction('删除这笔账？',
        '删除后不计入统计，可在「我的 - 数据恢复」里找回。' +
        (repayCount ? '这笔借款挂着 ' + repayCount + ' 笔还款，会一并删除。' : ''), () => {
        const t = db.txns.find(x => x.id === id);
        if (t) {
          t.deleted_at = Date.now();
          db.settlements.forEach(s => { if (s.txn_id === id && !s.deleted_at) s.deleted_at = t.deleted_at; });
          saveDb();
        }
        closeModal();
        toast(repayCount ? '已删除（含 ' + repayCount + ' 笔还款）' : '已删除');
        setTimeout(() => go('home'), 400);
      }, true);
    },
    restore(el) {
      const t = db.txns.find(x => x.id === el.dataset.id);
      if (t) {
        t.deleted_at = null;
        db.settlements.forEach(s => { if (s.txn_id === t.id) s.deleted_at = null; });
        saveDb();
        toast('已恢复');
        render();
      }
    },
    setDefaultAccount(el) {
      db.settings.defaultAccountId = el.value;
      saveDb();
      toast('默认账户已更新');
    },
    togglePending() {
      db.settings.pendingIncluded = !db.settings.pendingIncluded;
      saveDb();
      render();
    },
    newAccount() { openModal('account', { form: { id: '', name: '', type: 'cash', initial: '', sort: String(db.accounts.length), archived: false } }); },
    editAccount(el) {
      const a = db.accounts.find(x => x.id === el.dataset.id);
      if (!a) return;
      openModal('account', {
        form: { id: a.id, name: a.name, type: a.type, initial: fmtC(a.initial_balance_cents), sort: String(a.sort), archived: a.archived }
      });
    },
    saveAccount() { saveAccount(); },
    formArchived() {
      state.modal.form.archived = !state.modal.form.archived;
      render();
    },
    newCategory(el) {
      openModal('category', {
        form: { id: '', name: '', icon: '📦', sort: '99', type: el.dataset.type, archived: false, isSystem: false }
      });
    },
    editCategory(el) {
      const c = db.categories.find(x => x.id === el.dataset.id);
      if (!c) return;
      openModal('category', {
        form: { id: c.id, name: c.name, icon: c.icon, sort: String(c.sort), type: c.type, archived: c.archived, isSystem: !!c.is_system }
      });
    },
    saveCategory() { saveCategory(); },
    newPerson() { openModal('person', { form: { id: '', name: '', kind: 'friend', note: '', archived: false } }); },
    savePerson() { savePerson(); },
    person(el) { go('person', { id: el.dataset.id }); },
    openSettle(el) { openSettle(el.dataset.id); },
    openLoanRepay(el) { openLoanRepay(el.dataset.id); },
    openReimburse(el) { openReimburse(el.dataset.id, Number(el.dataset.amount)); },
    saveSettle() { saveSettle(); },
    openBudget() { openModal('budget', { form: { amount: '' } }); },
    saveBudget() { saveBudget(); },
    confirmYes() {
      const fn = state.pendingConfirm;
      state.pendingConfirm = null;
      state.modal = null;
      if (fn) fn();
    },
    closeModal() { closeModal(); },
    export() { exportCsv(); },
    demo() {
      confirmAction('填充示例数据？', '会往当前账本追加一批演示记录（六类动作、分摊、待报销），方便看统计效果。', () => {
        closeModal();
        loadDemo();
      });
    },
    clear() {
      confirmAction('清空全部数据？', '所有账单与结算都会被删除（软删除，可在数据恢复里找回），账户与分类保留。', () => {
        closeModal();
        const now = Date.now();
        db.txns.forEach(t => { if (!t.deleted_at) t.deleted_at = now; });
        db.settlements.forEach(s => { if (!s.deleted_at) s.deleted_at = now; });
        saveDb();
        toast('已清空');
        setTimeout(() => go('home'), 400);
      }, true);
    }
  };

  function onClick(e) {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    if (el.matches('select, input, textarea')) return;
    if (act === 'submitConfirm') return;
    if (handlers[act]) {
      e.preventDefault();
      handlers[act](el, e);
    }
  }

  function onChange(e) {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    const d = state.draft;
    if (act === 'pickMonth') { state.period = el.value || state.period; render(); return; }
    if (act === 'setToAccount') { d.toAccountId = el.value; return; }
    if (act === 'setPerson') { d.personId = el.value; return; }
    if (act === 'setDate') { d.dateText = el.value; return; }
    if (act === 'setDefaultAccount') { handlers.setDefaultAccount(el); return; }
  }

  function onInput(e) {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    if (el.dataset.act === 'note') state.draft.note = el.value.slice(0, 50);
    if (el.dataset.act === 'customName') state.draft.customName = el.value.slice(0, 8);
    if (el.dataset.act === 'searchKw') {
      state.kw = el.value;
      const body = document.getElementById('search-body');
      if (body) body.innerHTML = searchBodyHtml();
      return;
    }
    if (el.dataset.act === 'catKw') {
      state.catKw = el.value;
      const body = document.getElementById('cat-body');
      if (body) body.innerHTML = catBodyHtml();
    }
  }

  // ========== 保存逻辑 ==========
  function saveTxn() {
    const d = state.draft;
    if (!d) return;
    let cents = 0;
    try { cents = parseYuan(d.amountText); } catch (err) { toast(err.message); return; }
    if (cents <= 0) { toast('请先输入金额'); return; }
    const accounts = visibleAccounts();
    if (!accounts.some(a => a.id === d.accountId)) { toast('请选择账户'); return; }
    if ((d.type === 'expense' || d.type === 'income') && !d.categoryId) { toast('请选择分类'); return; }
    if (d.type === 'transfer') {
      if (!d.toAccountId) { toast('请选择转入账户'); return; }
      if (d.toAccountId === d.accountId) { toast('转出与转入不能是同一个账户'); return; }
    }
    if ((d.type === 'loan_out' || d.type === 'loan_in') && !activePersons().some(p => p.id === d.personId)) { toast('请选择往来对象'); return; }
    if (d.type === 'expense' && d.reimburse && !activePersons().some(p => p.id === d.personId)) { toast('请选择报销对象'); return; }

    const occurredAt = new Date(d.dateText + 'T00:00:00').getTime() || todayTs();
    const isFlow = d.type === 'expense' || d.type === 'income';
    const txn = {
      id: d.id || uid('txn'),
      type: d.type,
      amount_cents: cents,
      account_id: d.accountId,
      to_account_id: d.type === 'transfer' ? d.toAccountId : null,
      category_id: isFlow ? resolveCategoryId(d) : null,
      person_id: (d.type === 'loan_out' || d.type === 'loan_in')
        ? (d.personId || null)
        : (d.type === 'expense' && d.reimburse ? (d.personId || null) : null),
      note: (d.note || '').slice(0, 50),
      occurred_at: occurredAt,
      created_at: Date.now(),
      updated_at: Date.now(),
      deleted_at: null,
      reimburse_status: (d.type === 'expense' && d.reimburse) ? 'pending' : 'none'
    };

    let parts = null;
    const selected = d.splits.filter(s => s.checked);
    if (d.type === 'expense' && selected.length) {
      const pr = splitParts();
      if (pr) parts = pr.slice(1);
      const sum = parts.reduce((a, b) => a + b, 0);
      if (sum > cents) { toast('分摊总额不能超过这笔支出的金额'); return; }
    }

    if (d.id) {
      const idx = db.txns.findIndex(t => t.id === d.id);
      if (idx < 0) { toast('这笔账不存在'); return; }
      txn.created_at = db.txns[idx].created_at;
      db.txns[idx] = txn;
      db.splits = db.splits.filter(s => s.transaction_id !== txn.id);
    } else {
      db.txns.push(txn);
    }
    if (parts) {
      selected.forEach((s, i) => {
        db.splits.push({
          id: uid('spl'), transaction_id: txn.id, person_id: s.person_id,
          share_cents: parts[i], direction: 'they_owe'
        });
      });
    }
    const editId = d.id;
    saveDb();
    state.draft = null;
    state.draftKey = '';
    if (editId) {
      toast('已更新');
      setTimeout(() => go('detail', { id: editId }), 300);
    } else {
      toast('已记下');
      setTimeout(() => go('home'), 300);
    }
  }

  function saveAccount() {
    const form = state.modal.form;
    const name = document.getElementById('f-name').value.trim();
    if (!name) { toast('请填写账户名'); return; }
    const initialText = document.getElementById('f-initial').value.trim();
    let initial = 0;
    try {
      const negative = initialText.charAt(0) === '-';
      const abs = negative ? initialText.slice(1) : initialText;
      initial = parseYuan(abs);
      if (negative) initial = -initial;
    } catch (err) { toast(err.message); return; }
    const patch = {
      name,
      type: document.getElementById('f-type').value || 'cash',
      initial_balance_cents: initial,
      sort: Number(document.getElementById('f-sort').value) || db.accounts.length,
      archived: !!form.archived
    };
    if (form.id) {
      const a = db.accounts.find(x => x.id === form.id);
      if (!a) { toast('账户不存在'); return; }
      Object.assign(a, patch);
    } else {
      db.accounts.push(Object.assign({ id: uid('acc'), created_at: Date.now() }, patch));
    }
    saveDb();
    closeModal();
    toast('已保存');
    render();
  }

  function saveCategory() {
    const form = state.modal.form;
    const name = document.getElementById('f-name').value.trim();
    if (!name) { toast('请填写分类名'); return; }
    const patch = {
      name,
      icon: document.getElementById('f-icon').value.trim() || '📦',
      sort: Number(document.getElementById('f-sort').value) || 99,
      archived: !!form.archived
    };
    if (form.id) {
      const c = db.categories.find(x => x.id === form.id);
      if (!c) { toast('分类不存在'); return; }
      Object.assign(c, patch);
    } else {
      const created = Object.assign({
        id: uid('cat'), type: form.type, color: COLORS[db.categories.length % COLORS.length],
        is_system: false, sort: 99, archived: false
      }, patch);
      db.categories.push(created);
      if (state.view === 'record' && state.draft && state.draft.type === form.type) {
        state.draft.categoryId = created.id;
        state.draft.customName = '';
      }
    }
    saveDb();
    closeModal();
    toast('已保存');
    render();
  }

  function savePerson() {
    const form = state.modal.form;
    const name = document.getElementById('f-name').value.trim();
    if (!name) { toast('请填写姓名'); return; }
    const patch = {
      name,
      kind: document.getElementById('f-kind').value || 'friend',
      note: document.getElementById('f-note').value.trim().slice(0, 30),
      archived: !!form.archived
    };
    let createdId = '';
    if (form.id) {
      const p = db.persons.find(x => x.id === form.id);
      if (!p) { toast('对象不存在'); return; }
      Object.assign(p, patch);
    } else {
      const np = Object.assign({ id: uid('per'), created_at: Date.now() }, patch);
      db.persons.push(np);
      createdId = np.id;
    }
    // 在「记一笔」里新建的对象直接选中
    if (createdId && state.view === 'record' && state.draft) {
      state.draft.personId = createdId;
    }
    saveDb();
    closeModal();
    toast('已保存');
    render();
  }

  function openSettle(personId) {
    const balances = ledger.personBalances(db.persons, db.txns, db.splits, db.settlements);
    const b = balances[personId] || 0;
    if (b === 0) { toast('这个人已经结清了'); return; }
    openModal('settle', {
      form: {
        personId,
        title: '结算',
        direction: b > 0 ? 'in' : 'out',
        amount: fmtC(Math.abs(b)),
        date: fmtDate(todayTs()),
        note: '',
        txnId: ''
      }
    });
  }

  function openLoanRepay(txnId) {
    const txn = db.txns.find(t => t.id === txnId);
    if (!txn) { toast('这笔账不存在'); return; }
    const out = ledger.loanOutstanding(txn, db.settlements);
    if (out <= 0) { toast('这笔已经还清了'); return; }
    const isOut = txn.type === 'loan_out';
    openModal('settle', {
      form: {
        personId: txn.person_id,
        title: (isOut ? '确认收回' : '确认还款') + ' · ' + perOf(txn.person_id).name,
        direction: isOut ? 'in' : 'out',
        amount: fmtC(out),
        date: fmtDate(todayTs()),
        note: isOut ? '收回借款' : '归还借款',
        txnId: txn.id,
        confirmText: isOut ? '确认已收款' : '确认已还款'
      }
    });
  }

  function openReimburse(txnId, amount) {
    const txn = db.txns.find(t => t.id === txnId);
    if (!txn) return;
    openModal('settle', {
      form: {
        personId: txn.person_id,
        title: '报销到账',
        direction: 'in',
        amount: fmtC(amount),
        date: fmtDate(todayTs()),
        note: '报销到账',
        txnId: txnId
      }
    });
  }

  function saveSettle() {
    const f = state.modal.form;
    let cents = 0;
    try { cents = parseYuan(document.getElementById('f-amount').value); } catch (err) { toast(err.message); return; }
    if (cents <= 0) { toast('请输入结算金额'); return; }
    const accountId = document.getElementById('f-account').value;
    const dateText = document.getElementById('f-date').value;
    const note = document.getElementById('f-note').value.trim().slice(0, 50);
    if (!accountId) { toast('请先添加一个账户'); return; }

    const base = {
      person_id: f.personId,
      direction: f.direction,
      account_id: accountId,
      occurred_at: new Date(dateText + 'T00:00:00').getTime() || todayTs(),
      note,
      created_at: Date.now(),
      deleted_at: null
    };
    const t = f.txnId ? db.txns.find(x => x.id === f.txnId) : null;

    if (t) {
      // 单笔还款：直接挂在这笔借出/借入上
      db.settlements.push(Object.assign({ id: uid('set'), amount_cents: cents, txn_id: t.id, direction: f.direction }, base));
      if (t.type === 'expense') t.reimburse_status = 'done';
    } else {
      // 整人结清：先把钱冲抵这个人还没还的借款，剩下的记一笔普通结算
      let rest = cents;
      const openLoans = db.txns.filter(x => !x.deleted_at && x.person_id === f.personId &&
        ((f.direction === 'in' && x.type === 'loan_out') || (f.direction === 'out' && x.type === 'loan_in')))
        .sort((a, b) => a.occurred_at - b.occurred_at);
      openLoans.forEach(x => {
        if (rest <= 0) return;
        const out = ledger.loanOutstanding(x, db.settlements);
        if (out <= 0) return;
        const take = Math.min(out, rest);
        db.settlements.push(Object.assign({ id: uid('set'), amount_cents: take, txn_id: x.id }, base));
        rest -= take;
      });
      if (rest > 0) db.settlements.push(Object.assign({ id: uid('set'), amount_cents: rest }, base));
    }

    saveDb();
    closeModal();
    if (t) {
      const out = ledger.loanOutstanding(t, db.settlements);
      toast(out === 0 ? '已还清' : '已记录还款，还剩 ' + yuan(out));
    } else {
      toast('已结算');
    }
    render();
  }

  function saveBudget() {
    const target = document.getElementById('f-target') ? document.getElementById('f-target').value : '';
    let cents = 0;
    try { cents = parseYuan(document.getElementById('f-amount').value); } catch (err) { toast(err.message); return; }
    if (cents <= 0) { toast('请输入预算金额'); return; }
    const existing = db.budgets.find(b => b.period === state.period && (b.category_id || '') === (target || ''));
    if (existing) existing.amount_cents = cents;
    else db.budgets.push({ id: uid('bud'), period: state.period, category_id: target || null, amount_cents: cents, created_at: Date.now() });
    saveDb();
    closeModal();
    toast('预算已保存');
    render();
  }

  // ========== CSV 导出 ==========
  function csvCell(v) {
    const t = v == null ? '' : String(v);
    return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  }

  function exportCsv() {
    const rows = [['日期', '类型', '金额(元)', '分类', '账户', '转入账户', '对方', '备注', '报销状态', '记录时间']];
    const entries = [];
    db.txns.filter(t => !t.deleted_at).forEach(t => {
      entries.push({
        d: t.occurred_at,
        row: [
          fmtDate(t.occurred_at),
          TYPE_LABELS[t.type] || t.type,
          fmtC(t.amount_cents),
          t.category_id ? catOf(t.category_id).name : '',
          accOf(t.account_id).name,
          t.to_account_id ? accOf(t.to_account_id).name : '',
          t.person_id ? perOf(t.person_id).name : '',
          t.note || '',
          t.reimburse_status === 'pending' ? '待报销' : (t.reimburse_status === 'done' ? '已报销' : ''),
          fmtDT(t.created_at)
        ]
      });
    });
    db.settlements.filter(s => !s.deleted_at).forEach(s => {
      entries.push({
        d: s.occurred_at,
        row: [
          fmtDate(s.occurred_at),
          s.txn_id ? '还款' : '结算',
          fmtC(s.amount_cents),
          '',
          accOf(s.account_id).name,
          '',
          perOf(s.person_id).name,
          s.note || '',
          '',
          fmtDT(s.created_at)
        ]
      });
    });
    entries.sort((a, b) => a.d - b.d).forEach(e => rows.push(e.row));
    const csv = '\uFEFF' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
    try {
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '记一笔-全部账单-' + fmtDate(todayTs()).replace(/-/g, '') + '.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      toast('已导出 CSV');
    } catch (err) {
      toast('这个浏览器不支持直接下载');
    }
  }

  // ========== 示例数据 ==========
  function ensurePerson(name, kind) {
    let p = db.persons.find(x => x.name === name);
    if (!p) {
      p = { id: uid('per'), name, kind, note: '', archived: false, created_at: Date.now() };
      db.persons.push(p);
    }
    return p;
  }
  function catByName(name, type) {
    return db.categories.find(c => c.name === name && c.type === type);
  }
  function accByName(name) {
    return db.accounts.find(a => a.name === name);
  }

  function loadDemo() {
    const p = state.period;
    const { y, m } = parsePeriod(p);
    const at = (day, hh) => new Date(y, m - 1, day, hh || 12, 0, 0).getTime();
    const wang = ensurePerson('小王', 'friend');
    const li = ensurePerson('小李', 'friend');
    const company = ensurePerson('公司', 'company');

    const add = (type, cents, opts) => {
      const t = {
        id: uid('txn'), type, amount_cents: cents,
        account_id: accByName(opts.acc || '微信').id,
        to_account_id: opts.to ? accByName(opts.to).id : null,
        category_id: opts.cat ? catByName(opts.cat, type).id : null,
        person_id: opts.person ? opts.person.id : null,
        note: opts.note || '',
        occurred_at: at(opts.day), created_at: Date.now(), updated_at: Date.now(),
        deleted_at: null, reimburse_status: opts.reimburse ? 'pending' : 'none'
      };
      db.txns.push(t);
      if (opts.splits) {
        opts.splits.forEach(s => db.splits.push({
          id: uid('spl'), transaction_id: t.id, person_id: s.person_id, share_cents: s.share, direction: 'they_owe'
        }));
      }
      return t;
    };

    // 本月
    add('income', 800000, { cat: '工资', acc: '银行卡', day: 5, note: '十月工资' });
    add('income', 20000, { cat: '红包', acc: '微信', day: 8, note: '家人红包' });
    add('expense', 250000, { cat: '居住', acc: '银行卡', day: 1, note: '房租' });
    add('expense', 12000, { cat: '买菜', acc: '微信', day: 3, note: '超市' });
    add('expense', 2800, { cat: '餐饮', acc: '微信', day: 6, note: '咖啡' });
    add('expense', 600, { cat: '交通', acc: '支付宝', day: 7, note: '地铁' });
    add('transfer', 100000, { acc: '微信', to: '支付宝', day: 9, note: '微信转支付宝' });
    add('loan_out', 50000, { acc: '微信', person: wang, day: 10, note: '借给小王的现金' });
    add('expense', 5000, { acc: '支付宝', person: company, day: 11, note: '打车去客户现场', cat: '交通', reimburse: true });
    add('expense', 30000, {
      acc: '微信', cat: '餐饮', day: 12, note: '聚餐 AA',
      splits: [{ person_id: li.id, share: 7500 }, { person_id: wang.id, share: 7500 }, { person_id: company.id, share: 7500 }]
    });

    // 前两个月，做趋势用
    const prev1 = shiftPeriod(p, -1);
    const d1 = parsePeriod(prev1);
    const at1 = (day) => new Date(d1.y, d1.m - 1, day, 12, 0, 0).getTime();
    const addPrev = (type, cents, catName, accName, day, note) => {
      db.txns.push({
        id: uid('txn'), type, amount_cents: cents, account_id: accByName(accName).id,
        to_account_id: null, category_id: catByName(catName, type).id, person_id: null,
        note, occurred_at: at1(day), created_at: Date.now(), updated_at: Date.now(),
        deleted_at: null, reimburse_status: 'none'
      });
    };
    addPrev('income', 800000, '工资', '银行卡', 5, '上月工资');
    addPrev('expense', 250000, '居住', '银行卡', 1, '房租');
    addPrev('expense', 96000, '餐饮', '微信', 14, '吃饭');

    const prev2 = shiftPeriod(p, -2);
    const d2 = parsePeriod(prev2);
    db.txns.push({
      id: uid('txn'), type: 'income', amount_cents: 760000, account_id: accByName('银行卡').id,
      to_account_id: null, category_id: catByName('工资', 'income').id, person_id: null,
      note: '工资', occurred_at: new Date(d2.y, d2.m - 1, 5, 12).getTime(), created_at: Date.now(),
      updated_at: Date.now(), deleted_at: null, reimburse_status: 'none'
    });
    db.txns.push({
      id: uid('txn'), type: 'expense', amount_cents: 180000, account_id: accByName('银行卡').id,
      to_account_id: null, category_id: catByName('居住', 'expense').id, person_id: null,
      note: '房租 + 水电', occurred_at: new Date(d2.y, d2.m - 1, 2, 12).getTime(), created_at: Date.now(),
      updated_at: Date.now(), deleted_at: null, reimburse_status: 'none'
    });

    // 预算
    if (!db.budgets.some(b => b.period === p && !b.category_id)) {
      db.budgets.push({ id: uid('bud'), period: p, category_id: null, amount_cents: 600000, created_at: Date.now() });
    }
    if (!db.budgets.some(b => b.period === p && b.category_id === catByName('餐饮', 'expense').id)) {
      db.budgets.push({ id: uid('bud'), period: p, category_id: catByName('餐饮', 'expense').id, amount_cents: 80000, created_at: Date.now() });
    }

    db.settings.demoLoaded = true;
    saveDb();
    toast('示例数据已填充');
    setTimeout(() => go('home'), 400);
  }

  // ========== 启动 ==========
  window.addEventListener('hashchange', () => { parseHash(); render(); });
  window.addEventListener('resize', () => { if (state.view === 'stats') drawCharts(); });

  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('input', onInput);

  // 桌面端：记录页可直接用键盘输入金额
  document.addEventListener('keydown', (e) => {
    if (state.view !== 'record' || state.modal) return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    let k = null;
    if (/^[0-9]$/.test(e.key)) k = e.key;
    else if (e.key === '.') k = '.';
    else if (e.key === 'Backspace') k = 'back';
    else if (e.key === 'Enter') k = 'enter';
    if (!k) return;
    e.preventDefault();
    if (k === 'enter') { handlers.saveTxn(); return; }
    handlers.key({ dataset: { key: k } });
  });

  if (migrateLoanAllocs()) saveDb();

  if (!location.hash) {
    location.hash = '#/home';
  }
  parseHash();
  render();
})();
</script>
