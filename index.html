<html lang="zh-CN">

<title>记一笔 · 记账</title>
<style>
/* ===== 基础与配色 ===== */

body{

}

}

.muted{color:#9AA3AF}
.red{color:#D9553F}
.green{color:#1F9D55}
.hint{font-size:12px;color:#9AA3AF;line-height:1.7;padding:8px 6px 20px}
.section-gap{height:12px}

/* ===== 顶栏 ===== */
.topbar{
  position:sticky;top:0;z-index:20;background:#F6F7F9;
  display:flex;align-items:center;height:52px;padding:0 12px;
}
.topbar .back{width:36px;font-size:22px;color:#4E5969;cursor:pointer;line-height:36px}
.topbar .title{font-size:17px;font-weight:600;flex:1;text-align:center;margin-right:36px}

.card{background:#fff;border-radius:12px;padding:14px;margin:0 12px 12px;box-shadow:0 1px 6px rgba(31,35,41,.04)}
.card.flat{padding:0;overflow:hidden}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 10px}
.section-title{font-size:14px;font-weight:600}
.section-extra{font-size:12px;color:#9AA3AF;cursor:pointer}
.line{height:1px;background:#EDEFF2}

.month-bar{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 12px 14px}

}
.overview{display:flex;align-items:center;padding:18px 4px}
.overview .col{flex:1;text-align:center;min-width:0}
.overview .label{font-size:11px;color:#9AA3AF;margin-bottom:6px}
.overview .value{font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden}

/* ===== 按日分组列表 ===== */
.day-group{background:#fff;border-radius:12px;margin:0 12px 10px;overflow:hidden}
.day-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 4px}
.day-head .d{font-size:12px;color:#86909C}
.day-head .s{font-size:12px;color:#86909C}
.day-head .s b{color:#1F9D55;font-weight:500}

.txn:active{background:#FAFBFC}
.txn.transfer-row{background:#F7F8FA;margin:2px 4px;border-radius:8px}
.txn .ico{

  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0
}
.txn .main{flex:1;min-width:0;margin-left:10px}
.txn .t{font-size:15px;color:#1F2329;font-weight:500;display:flex;align-items:center;gap:6px}
.txn .tag{font-size:10px;font-weight:400;color:#B57A1E;background:#FDF3E3;border-radius:4px;padding:1px 5px}
.txn .tag.done{color:#1F9D55;background:#EAF6EF}
.txn .sub{font-size:12px;color:#9AA3AF;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== 底部主按钮区 ===== */
.bottom-bar{

/* ===== 标签页 ===== */

.legend-row .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== 弹层 ===== */

  position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(31,35,41,.9);color:#fff;
  font-size:13px;padding:9px 16px;border-radius:8px;z-index:90;max-width:80vw;text-align:center;

<body>
<div id="app"></div>
<script>
/**
 * 记一笔 · 网页版
 * 口径与小程序版一致：金额整数分、方向靠 type、转账/借还/结算不进收支。
 * 数据存 localStorage，只在这台设备的这个浏览器里。
 */
(function () {
  'use strict';

  // ========== 基础工具 ==========
  const LS_KEY = 'jiyibi.v1';
  const WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  const pad2 = n => String(n).padStart(2, '0');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // 金额：一律整数分
  function fmtC(cents) {
    const v = Math.round(Number(cents) || 0);
    const sign = v < 0 ? '-' : '';
    const a = Math.abs(v);
    return sign + Math.floor(a / 100) + '.' + pad2(a % 100);
  }
  function yuan(cents) {
    const t = fmtC(cents);
    return t.charAt(0) === '-' ? '-¥' + t.slice(1) : '¥' + t;
  }
  function signedYuan(cents, type) {
    const a = fmtC(Math.abs(cents));
    if (type === 'income') return '+¥' + a;
    if (type === 'expense') return '-¥' + a;
    return '¥' + a;
  }
  function parseYuan(raw) {
    if (raw == null) return 0;
    const text = String(raw).trim();
    if (!text) return 0;
    if (!/^\d*(\.\d*)?$/.test(text) || text === '.') throw new Error('金额格式不正确');
    const parts = text.split('.');
    const intPart = parts[0] || '0';
    const decPart = parts[1] || '';
    if (decPart.length > 2) throw new Error('金额最多两位小数');
    if (intPart.length > 5) throw new Error('金额不能超过 99999.99');
    const total = (parseInt(intPart, 10) || 0) * 100 + (parseInt((decPart + '00').slice(0, 2), 10) || 0);
    if (total > 9999999) throw new Error('金额不能超过 99999.99');
    return total;
  }

  // 日期：全部本地时区
  function parsePeriod(p) {
    const m = /^(\d{4})-(\d{2})$/.exec(String(p));
    if (!m) throw new Error('月份格式错误');
    return { y: Number(m[1]), m: Number(m[2]) };
  }
  function curPeriod() {
    const d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
  }
  function shiftPeriod(p, delta) {
    const { y, m } = parsePeriod(p);
    const d = new Date(y, m - 1 + delta, 1);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
  }
  function monthRange(p) {
    const { y, m } = parsePeriod(p);
    return { start: new Date(y, m - 1, 1).getTime(), end: new Date(y, m, 1).getTime() };
  }
  function yearRange(year) {
    const y = Number(year);
    return { start: new Date(y, 0, 1).getTime(), end: new Date(y + 1, 0, 1).getTime() };
  }
  function monthLabel(p) {
    const { y, m } = parsePeriod(p);
    return y + '年' + m + '月';
  }
  function periodOf(ts) {
    const d = new Date(Number(ts));
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
  }
  function dayKey(ts) {
    const d = new Date(Number(ts));
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function dayLabel(ts) {
    const d = new Date(Number(ts));
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + WEEK[d.getDay()];
  }
  function fmtDate(ts) {
    const d = new Date(Number(ts));
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function fmtDT(ts) {
    if (!ts) return '';
    const d = new Date(Number(ts));
    return fmtDate(ts) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function todayTs() {
    const d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  }
  function fromDateText(text) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(text || ''));
    if (!m) return todayTs();
    return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])).getTime();
  }

  // ========== 记账口径（与小程序 utils/ledger.js 一致） ==========
  const ledger = {
    live(t) { return !!t && !t.deleted_at; },
    myShare(txn, splits) {
      const amount = Math.abs(Number(txn.amount_cents) || 0);
      let others = 0;
      (splits || []).forEach(s => {
        if (s.transaction_id === txn.id && s.direction === 'they_owe') others += Math.abs(s.share_cents);
      });
      const mine = amount - others;
      return mine > 0 ? mine : 0;
    },
    sumExpense(txns, splits, opts) {
      const includePending = opts && opts.includePending;
      let total = 0;
      (txns || []).forEach(t => {
        if (!ledger.live(t) || t.type !== 'expense') return;
        if (!includePending && t.reimburse_status === 'pending') return;
        total += ledger.myShare(t, splits);
      });
      return total;
    },
    sumIncome(txns) {
      let total = 0;
      (txns || []).forEach(t => {
        if (!ledger.live(t) || t.type !== 'income') return;
        total += Math.abs(t.amount_cents);
      });
      return total;
    },
    accountBalances(accounts, txns, settlements) {
      const map = {};
      accounts.forEach(a => { map[a.id] = Number(a.initial_balance_cents) || 0; });
      const add = (id, c) => { if (id && map[id] !== undefined) map[id] += c; };
      (txns || []).forEach(t => {
        if (!ledger.live(t)) return;
        const a = Math.abs(t.amount_cents);
        if (t.type === 'expense') add(t.account_id, -a);
        else if (t.type === 'income') add(t.account_id, a);
        else if (t.type === 'loan_out') add(t.account_id, -a);
        else if (t.type === 'loan_in') add(t.account_id, a);
        else if (t.type === 'transfer') { add(t.account_id, -a); add(t.to_account_id, a); }
      });
      (settlements || []).forEach(s => {
        if (!ledger.live(s)) return;
        add(s.account_id, s.direction === 'in' ? s.amount_cents : -s.amount_cents);
      });
      return map;
    },
    personBalances(persons, txns, splits, settlements) {
      const map = {};
      persons.forEach(p => { map[p.id] = 0; });
      const add = (id, c) => { if (id && map[id] !== undefined) map[id] += c; };
      const liveMap = {};
      (txns || []).forEach(t => { if (ledger.live(t)) liveMap[t.id] = t; });
      (splits || []).forEach(s => {
        if (!liveMap[s.transaction_id]) return;
        add(s.person_id, s.direction === 'we_owe' ? -s.share_cents : s.share_cents);
      });
      (txns || []).forEach(t => {
        if (!ledger.live(t)) return;
        if (t.type === 'loan_out') add(t.person_id, Math.abs(t.amount_cents));
        if (t.type === 'loan_in') add(t.person_id, -Math.abs(t.amount_cents));
        if (t.type === 'expense' && t.reimburse_status && t.reimburse_status !== 'none') {
          add(t.person_id, ledger.myShare(t, splits));
        }
      });
      (settlements || []).forEach(s => {
        if (!ledger.live(s)) return;
        add(s.person_id, s.direction === 'in' ? -s.amount_cents : s.amount_cents);
      });
      return map;
    },
    /* 单笔借出/借入已还金额：认直接挂账的还款，也认整人结清时摊过来的部分 */
    loanRepaid(txn, settlements) {
      let sum = 0;
      (settlements || []).forEach(s => {
        if (!ledger.live(s)) return;
        if (s.txn_id === txn.id) { sum += Math.abs(Number(s.amount_cents) || 0); return; }
        const allocs = s.repay_allocs;
        if (allocs && allocs.length) allocs.forEach(a => {
          if (a.txn_id === txn.id) sum += Math.abs(Number(a.cents) || 0);
        });
      });
      return Math.min(sum, Math.abs(Number(txn.amount_cents) || 0));
    },
    loanOutstanding(txn, settlements) {
      return Math.max(0, Math.abs(Number(txn.amount_cents) || 0) - ledger.loanRepaid(txn, settlements));
    },
    savingRate(income, expense) {
      if (income <= 0) return { value: null, text: '—' };
      const v = ((income - expense) / income) * 100;
      return { value: v, text: v.toFixed(1) + '%' };
    },
    byCategory(txns, splits, categories, type, opts) {
      const includePending = opts && opts.includePending;
      const sums = {};
      (txns || []).forEach(t => {
        if (!ledger.live(t) || t.type !== type) return;
        if (type === 'expense' && !includePending && t.reimburse_status === 'pending') return;
        const amount = type === 'expense' ? ledger.myShare(t, splits) : Math.abs(t.amount_cents);
        const key = t.category_id || 'unknown';
        sums[key] = (sums[key] || 0) + amount;
      });
      const total = Object.keys(sums).reduce((a, k) => a + sums[k], 0);
      const dict = {};
      categories.forEach(c => { dict[c.id] = c; });
      return Object.keys(sums).map(k => {
        const c = dict[k] || { name: '未分类', icon: '📦', color: '#9AA3AF' };
        return {
          id: k, name: c.name, icon: c.icon, color: c.color || '#1F6F5C',
          amount_cents: sums[k],
          percent: total > 0 ? Math.round((sums[k] / total) * 1000) / 10 : 0
        };
      }).sort((a, b) => b.amount_cents - a.amount_cents);
    },
    /* 最大余数法，余数给非付款人，付款人拿 floor */
    allocateShares(totalCents, weights, payerIndex) {
      const total = Math.round(totalCents || 0);
      const w = weights || [];
      const payer = payerIndex === undefined ? 0 : payerIndex;
      const sumW = w.reduce((a, b) => a + Math.max(0, Math.round(b)), 0);
      if (!w.length) return [];
      if (sumW <= 0) { const z = w.map(() => 0); z[payer] = total; return z; }
      const parts = [], rems = [];
      let assigned = 0;
      w.forEach((weight, i) => {
        const ww = Math.max(0, Math.round(weight));
        const exact = total * ww;
        const share = Math.floor(exact / sumW);
        parts[i] = share;
        rems[i] = exact % sumW;
        assigned += share;
      });
      let rest = total - assigned;
      const order = [];
      w.forEach((_, i) => { if (i !== payer) order.push(i); });
      order.sort((a, b) => rems[b] - rems[a] || a - b);
      order.push(payer);
      const queue = order.concat(order);
      for (let i = 0; i < queue.length && rest > 0; i++) { parts[queue[i]] += 1; rest -= 1; }
      return parts;
    }
  };

  // ========== 数据存储 ==========
  let seq = 0;
  function uid(prefix) {
    seq += 1;
    return prefix + '_' + Date.now().toString(36) + '_' + seq;
  }

  const COLORS = ['#1F6F5C', '#E8A33D', '#4E7BC7', '#C4674E', '#7A6BC4', '#3F9E8E',
    '#B9586E', '#6E8B3D', '#8C6239', '#5C7A99', '#A35EA0', '#9AA3AF'];

  const EXPENSE_CATS = [['餐饮', '🍜'], ['买菜', '🥬'], ['交通', '🚌'], ['居住', '🏠'],
    ['水电燃气', '💡'], ['通讯', '📱'], ['购物', '🛍'], ['医疗', '💊'],
    ['教育', '📚'], ['娱乐', '🎮'], ['人情', '🎁'], ['其他', '📦']];
  const INCOME_CATS = [['工资', '💰'], ['奖金', '🏆'], ['兼职', '💼'],
    ['红包', '🧧'], ['理财收入', '📈'], ['其他', '📦']];
  const ACCOUNTS = [['现金', 'cash'], ['微信', 'wechat'], ['支付宝', 'alipay'], ['银行卡', 'bank'], ['信用卡', 'credit']];

  function seedDb() {
    const accounts = ACCOUNTS.map((a, i) => ({
      id: uid('acc'), name: a[0], type: a[1], initial_balance_cents: 0, sort: i, archived: false
    }));
    let sort = 0;
    const categories = [];
    EXPENSE_CATS.forEach((c, i) => categories.push({
      id: uid('cat'), name: c[0], icon: c[1], color: COLORS[i % COLORS.length],
      type: 'expense', sort: sort++, is_system: true, archived: false
    }));
    INCOME_CATS.forEach((c, i) => categories.push({
      id: uid('cat'), name: c[0], icon: c[1], color: COLORS[i % COLORS.length],
      type: 'income', sort: sort++, is_system: true, archived: false
    }));
    return {
      household: { name: '我的账本' },
      accounts, categories, persons: [], txns: [], splits: [], settlements: [], budgets: [],
      settings: { defaultAccountId: '', pendingIncluded: false, demoLoaded: false }
    };
  }

  function normalize(d) {
    const base = seedDb();
    return {
      household: d.household || base.household,
      accounts: d.accounts || base.accounts,
      categories: d.categories || base.categories,
      persons: d.persons || [],
      txns: d.txns || [],
      splits: d.splits || [],
      settlements: d.settlements || [],
      budgets: d.budgets || [],
      settings: Object.assign({ defaultAccountId: '', pendingIncluded: false, demoLoaded: false }, d.settings || {})
    };
  }

  function loadDb() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) return normalize(JSON.parse(raw));
    } catch (e) { /* 读不出来就重新初始化 */ }
    return seedDb();
  }
  function saveDb() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(db)); } catch (e) { toast('本机存储写入失败'); }
  }

  let db = loadDb();

  /* 老账本里的「结清」没有挂到具体借款上，这里按时间顺序把它们摊到未还的借出/借入，
     保证「待收 / 待还」和往来余额一致；每次启动重算一遍，幂等。 */
  function migrateLoanAllocs() {
    let changed = false;
    db.settlements.forEach(s => {
      if (s && s.repay_allocs) { delete s.repay_allocs; changed = true; }
    });
    db.settlements.filter(s => !s.deleted_at && !s.txn_id)
      .sort((a, b) => a.occurred_at - b.occurred_at)
      .forEach(s => {
        let rest = Math.abs(Number(s.amount_cents) || 0);
        if (rest <= 0 || !s.person_id) return;
        const loans = db.txns.filter(t => !t.deleted_at && t.person_id === s.person_id &&
          ((s.direction === 'in' && t.type === 'loan_out') || (s.direction === 'out' && t.type === 'loan_in')))
          .sort((a, b) => a.occurred_at - b.occurred_at);
        const allocs = [];
        loans.forEach(t => {
          if (rest <= 0) return;
          const out = ledger.loanOutstanding(t, db.settlements);
          if (out <= 0) return;
          const take = Math.min(out, rest);
          allocs.push({ txn_id: t.id, cents: take });
          s.repay_allocs = allocs.slice();
          rest -= take;
          changed = true;
        });
      });
    return changed;
  }

  // ========== 查询辅助 ==========
  const catOf = id => db.categories.find(c => c.id === id) || { name: '未分类', icon: '📦' };
  const accOf = id => db.accounts.find(a => a.id === id) || { name: '账户' };
  const perOf = id => db.persons.find(p => p.id === id) || { name: '对方' };
  function txnsIn(start, end) {
    return db.txns.filter(t => !t.deleted_at && t.occurred_at >= start && t.occurred_at < end);
  }
  function sortTxns(list) {
    return list.slice().sort((a, b) => (b.occurred_at - a.occurred_at) || (b.created_at - a.created_at));
  }
  function visibleAccounts() { return db.accounts.filter(a => !a.archived).sort((a, b) => a.sort - b.sort); }
  function activePersons() { return db.persons.filter(p => !p.archived); }

  // ========== 视图状态 ==========
  const state = {
    view: 'home',
    params: {},
    period: curPeriod(),
    statsMode: 'month',
    draft: null,
    draftKey: '',
    modal: null,
    toast: '',
    stats: null,
    pendingConfirm: null,
    prevView: '',
    kw: '',
    searchType: 'all',
    catKw: '',
    catKey: '',
    focusSearch: false
  };

  let toastTimer = null;
  function toast(text) {
    state.toast = text;
    render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { state.toast = ''; render(); }, 1800);
  }

  function go(view, params) {
    const qs = params ? Object.keys(params)
      .filter(k => params[k] !== undefined && params[k] !== null && params[k] !== '')
      .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k])).join('&') : '';
    const target = '#/' + view + (qs ? '?' + qs : '');
    if (location.hash === target) { parseHash(); render(); }
    else location.hash = target;
  }

  function parseHash() {
    const raw = location.hash.replace(/^#\/?/, '');
    const parts = raw.split('?');
    const view = parts[0] || 'home';
    const params = {};
    if (parts[1]) {
      parts[1].split('&').forEach(kv => {
        const [k, v] = kv.split('=');
        if (k) params[decodeURIComponent(k)] = decodeURIComponent(v || '');
      });
    }
    state.prevView = state.view;
    state.view = views[view] ? view : 'home';
    state.params = params;
    if (state.view === 'category') {
      const key = (params.type || 'expense') + ':' + (params.id || '');
      if (state.catKey !== key) { state.catKw = ''; state.catKey = key; }
    }
    if (state.view === 'record' && state.prevView !== 'record') {
      state.draft = null;
      state.draftKey = '';
    }
    if (state.view !== 'record') state.modal = null;
  }

  // ========== 记一笔草稿 ==========
  const TYPES = [
    { key: 'expense', label: '支出' },
    { key: 'income', label: '收入' },
    { key: 'transfer', label: '转账' },
    { key: 'loan_out', label: '借出' },
    { key: 'loan_in', label: '借入' }
  ];
  const TYPE_HINTS = {
    expense: '钱花出去了，计入本月支出',
    income: '钱进来了，计入本月收入',
    transfer: '自己的账户之间移动，不计入收支',
    loan_out: '借给别人，变成应收，不计入支出',
    loan_in: '向别人借钱，变成应付，不计入收入'
  };
  const TYPE_LABELS = { expense: '支出', income: '收入', transfer: '转账', loan_out: '借出', loan_in: '借入' };

  function catsOf(type) {
    return db.categories.filter(c => c.type === type && !c.archived).sort((a, b) => a.sort - b.sort);
  }

  // 选了「其他」且填了自定义名称时，取同名分类；没有就新建一个
  function resolveCategoryId(d) {
    const cat = db.categories.find(c => c.id === d.categoryId);
    if (!cat || cat.name !== '其他') return d.categoryId || null;
    const custom = (d.customName || '').trim();
    if (!custom) return cat.id;
    const exists = db.categories.find(c => c.type === cat.type && c.name === custom);
    if (exists) return exists.id;
    const sameType = db.categories.filter(c => c.type === cat.type);
    const maxSort = sameType.reduce((m, c) => Math.max(m, c.sort || 0), 0);
    const created = {
      id: uid('cat'), type: cat.type, name: custom, icon: '🏷',
      color: COLORS[sameType.length % COLORS.length],
      sort: maxSort + 1, archived: false, created_at: Date.now(), deleted_at: null
    };
    db.categories.push(created);
    return created.id;
  }

  function newDraft(type) {
    const accounts = visibleAccounts();
    const cats = catsOf(type);
    return {
      id: '',
      type: type,
      amountText: '',
      categoryId: cats[0] ? cats[0].id : '',
      accountId: db.settings.defaultAccountId && accounts.some(a => a.id === db.settings.defaultAccountId)
        ? db.settings.defaultAccountId : (accounts[0] ? accounts[0].id : ''),
      toAccountId: accounts[1] ? accounts[1].id : '',
      personId: (type === 'loan_out' || type === 'loan_in') && activePersons()[0] ? activePersons()[0].id : '',
      dateText: fmtDate(todayTs()),
      note: '',
      customName: '',
      reimburse: false,
      splits: activePersons().map(p => ({ person_id: p.id, checked: false, shares: 1 }))
    };
  }

  function draftFromTxn(txn) {
    const accounts = visibleAccounts();
    const d = newDraft(txn.type);
    d.id = txn.id;
    d.amountText = fmtC(txn.amount_cents);
    d.categoryId = txn.category_id || '';
    d.accountId = txn.account_id;
    d.toAccountId = txn.to_account_id || (accounts[1] ? accounts[1].id : '');
    d.personId = txn.person_id || '';
    d.dateText = fmtDate(txn.occurred_at);
    d.note = txn.note || '';
    d.reimburse = txn.reimburse_status === 'pending';
    const old = db.splits.filter(s => s.transaction_id === txn.id && s.direction === 'they_owe');
    d.splits = activePersons().map(p => {
      const found = old.find(s => s.person_id === p.id);
      return { person_id: p.id, checked: !!found, shares: 1 };
    });
    return d;
  }

  function ensureDraft() {
    if (state.view !== 'record') return;
    const key = location.hash;
    if (state.draft && state.draftKey === key) return;
    state.draftKey = key;
    if (state.params.id) {
      const txn = db.txns.find(t => t.id === state.params.id);
      if (!txn) { state.draft = newDraft('expense'); return; }
      state.draft = draftFromTxn(txn);
    } else {
      state.draft = newDraft(state.params.type || 'expense');
    }
  }

  // ========== 渲染 ==========
  const views = {
    home: viewHome, record: viewRecord, detail: viewDetail, stats: viewStats,
    settings: viewSettings, accounts: viewAccounts, categories: viewCategories,
    persons: viewPersons, person: viewPersonDetail,
    search: viewSearch, category: viewCategory
  };

  function render() {
    ensureDraft();
    const app = document.getElementById('app');
    app.innerHTML = views[state.view]() + modalHtml() + (state.toast ? '<div class="toast">' + esc(state.toast) + '</div>' : '');
    const tabbarEl = app.querySelector('.tabbar');
    const barEl = app.querySelector('.bottom-bar') || app.querySelector('.keypad');
    const tabh = tabbarEl ? tabbarEl.offsetHeight : 0;
    document.documentElement.style.setProperty('--tabh', tabh + 'px');
    app.style.paddingBottom = (tabh + (barEl ? barEl.offsetHeight : 0) + 18) + 'px';
    afterRender();
  }

  function afterRender() {
    if (state.view === 'stats') drawCharts();
    if (state.view === 'search' && state.focusSearch) {
      state.focusSearch = false;
      const q = document.getElementById('q');
      if (q) { q.focus(); const n = q.value.length; q.setSelectionRange(n, n); }
    }
  }

  function tabbar() {
    const items = [['home', '账单'], ['stats', '统计'], ['settings', '我的']];
    return '<div class="tabbar">' + items.map(([k, label]) =>
      '<div class="tab ' + (state.view === k ? 'on' : '') + '" data-act="tab" data-view="' + k + '">' + label + '</div>'
    ).join('') + '</div>';
  }

  function topbar(title, showBack) {
    return '<div class="topbar">' +
      (showBack ? '<div class="back" data-act="back">‹</div>' : '') +
      '<div class="title ' + (showBack ? '' : 'left') + '">' + esc(title) + '</div>' +
      '</div>';

  function txnIcon(txn) {
    if (txn.type === 'transfer') return '🔁';
    if (txn.type === 'loan_out') return '📤';
    if (txn.type === 'loan_in') return '📥';
    return catOf(txn.category_id).icon || '📦';
  }
  function txnTitle(txn) {
    if (txn.type === 'transfer') return accOf(txn.account_id).name + ' → ' + accOf(txn.to_account_id).name;
    if (txn.type === 'loan_out') return '借出给 ' + perOf(txn.person_id).name;
    if (txn.type === 'loan_in') return '向 ' + perOf(txn.person_id).name + ' 借入';
    return catOf(txn.category_id).name;
  }
  function txnSub(txn) {
    if (txn.type === 'transfer') return txn.note || '账户互转';
    if (txn.type === 'loan_out' || txn.type === 'loan_in') {
      const out = ledger.loanOutstanding(txn, db.settlements);
      const st = out === 0 ? '已还清' : '未还 ' + yuan(out);
      return (txn.note ? txn.note + ' · ' : '') + st;
    }
    return txn.note || accOf(txn.account_id).name;
  }
  function txnAmount(txn) {
    if (txn.type === 'income') return { text: signedYuan(txn.amount_cents, 'income'), cls: 'green' };
    if (txn.type === 'expense') return { text: signedYuan(txn.amount_cents, 'expense'), cls: '' };
    return { text: yuan(txn.amount_cents), cls: 'muted' };
  }

  function txnRow(txn) {
    const amt = txnAmount(txn);
    const isLoan = txn.type === 'loan_out' || txn.type === 'loan_in';
    const repaid = isLoan ? ledger.loanRepaid(txn, db.settlements) : 0;
    const tag = txn.reimburse_status === 'pending' ? '<span class="tag">待报销</span>'
      : (txn.reimburse_status === 'done' ? '<span class="tag done">已报销</span>'
        : (isLoan ? (repaid >= Math.abs(txn.amount_cents) ? '<span class="tag done">已还清</span>'
          : (repaid > 0 ? '<span class="tag">部分已还</span>' : '')) : ''));
    const isPlain = txn.type === 'transfer' || txn.type === 'loan_out' || txn.type === 'loan_in';
    const mine = txn.type === 'expense' ? ledger.myShare(txn, db.splits) : Math.abs(txn.amount_cents);
    const mineNote = (txn.type === 'expense' && mine < Math.abs(txn.amount_cents))
      ? ' · 我的 ' + yuan(mine) : '';
    return '<div class="txn ' + (isPlain ? 'transfer-row' : '') + '" data-act="detail" data-id="' + txn.id + '">' +
      '<div class="ico">' + txnIcon(txn) + '</div>' +
      '<div class="main"><div class="t"><span>' + esc(txnTitle(txn)) + '</span>' + tag + '</div>' +
      '<div class="sub">' + esc(txnSub(txn)) + mineNote + '</div></div>' +
      '<div class="amt num ' + amt.cls + '">' + amt.text + '</div>' +
      '</div>';
  }

  // ========== 视图：首页 ==========
  function viewHome() {
    const range = monthRange(state.period);
    const list = txnsIn(range.start, range.end);
    const includePending = db.settings.pendingIncluded;
    const expense = ledger.sumExpense(list, db.splits, { includePending });
    const income = ledger.sumIncome(list);
    const balance = income - expense;
    const perWord = state.period === curPeriod() ? '本月' : (Number(state.period.slice(5)) + '月');

    const groups = [];
    const map = {};
    sortTxns(list).forEach(t => {
      const k = dayKey(t.occurred_at);
      if (!map[k]) {
        map[k] = { key: k, label: dayLabel(t.occurred_at), expense: 0, income: 0, list: [] };
        groups.push(map[k]);
      }
      map[k].list.push(t);
      if (t.type === 'expense') {
        if (!includePending && t.reimburse_status === 'pending') {
          // 待报销不计入时，日汇总也不计，保持与顶部口径一致
        } else {
          map[k].expense += ledger.myShare(t, db.splits);
        }
      }
      if (t.type === 'income') map[k].income += Math.abs(t.amount_cents);
    });

    let body = '';
    if (!groups.length) {
      body = '<div class="empty-inline" style="padding:48px 0">这个月还没有记录<br><br>' +
        '<span class="mini-btn" data-act="nav" data-view="record" data-type="expense">记一笔</span></div>';
    } else {
      body = groups.map(g => {
        const sums = (g.expense ? '支出 ' + yuan(g.expense) : '') +
          (g.income ? ' <b>收入 ' + yuan(g.income) + '</b>' : '');
        return '<div class="day-group"><div class="day-head"><span class="d">' + g.label +
          '</span><span class="s">' + sums + '</span></div>' +
          g.list.map(txnRow).join('') + '</div>';
      }).join('');
    }

    return topbar('记一笔', false) +
      '<div class="month-bar">' +
      '<div class="arrow" data-act="month" data-delta="-1">‹</div>' +
      '<input class="month-input" type="month" value="' + state.period + '" data-act="pickMonth">' +
      '<div class="arrow" data-act="month" data-delta="1">›</div>' +
      '</div>' +
      '<div class="search-bar" data-act="openSearch"><span class="ic">🔍</span>' +
      '<span class="ph">搜索全部账单：分类、备注、对方、金额</span></div>' +
      '<div class="card overview">' +
      '<div class="col"><div class="label">' + perWord + '支出</div><div class="value num">' + yuan(expense) + '</div></div>' +
      '<div class="vline"></div>' +
      '<div class="col"><div class="label">' + perWord + '收入</div><div class="value num green">' + yuan(income) + '</div></div>' +
      '<div class="vline"></div>' +
      '<div class="col"><div class="label">结余</div><div class="value num">' + yuan(balance) + '</div></div>' +
      '</div>' +
      body +
      (groups.length ? '<div class="hint" style="text-align:center">共 ' + groups.length + ' 天记录</div>' : '') +
      '<div class="bottom-bar has-tab">' +
      '<div class="btn ghost" data-act="nav" data-view="record" data-type="transfer">转账</div>' +
      '<div class="btn primary" data-act="nav" data-view="record" data-type="expense">记一笔</div>' +
      '</div>' + tabbar();
  }

  // ========== 搜索：全账本 + 分类明细 ==========
  function haystack(t) {
    const splitNames = db.splits.filter(s => s.transaction_id === t.id)
      .map(s => perOf(s.person_id).name).join(' ');
    const dt = new Date(t.occurred_at);
    const cnDate = dt.getFullYear() + '年' + (dt.getMonth() + 1) + '月' + dt.getDate() + '日';
    return [
      t.note || '',
      catOf(t.category_id).name || '',
      perOf(t.person_id).name || '',
      splitNames,
      accOf(t.account_id).name || '',
      t.to_account_id ? accOf(t.to_account_id).name : '',
      TYPE_LABELS[t.type] || '',
      yuan(t.amount_cents), fmtC(t.amount_cents),
      fmtDate(t.occurred_at), cnDate,
      (dt.getMonth() + 1) + '月',
      String(Math.round(Math.abs(t.amount_cents) / 100))
    ].join(' ').toLowerCase();
  }
  function matchKw(t, kw) {
    const q = (kw || '').trim().toLowerCase();
    if (!q) return true;
    const hay = haystack(t);
    return q.split(/\s+/).filter(Boolean).every(k => hay.indexOf(k) >= 0);
  }
  function groupedListHtml(list, opts) {
    const o = opts || {};
    if (!list.length) {
      return '<div class="empty-inline" style="padding:44px 0">' + esc(o.empty || '没有匹配的账单') + '</div>';
    }
    const groups = [], map = {};
    sortTxns(list).forEach(t => {
      const k = dayKey(t.occurred_at);
      if (!map[k]) { map[k] = { key: k, ts: t.occurred_at, label: dayLabel(t.occurred_at), list: [] }; groups.push(map[k]); }
      map[k].list.push(t);
    });
    const thisYear = new Date().getFullYear();
    return groups.map(g => {
      const y = new Date(g.ts).getFullYear();
      const label = y === thisYear ? g.label : fmtDate(g.ts);
      return '<div class="day-group"><div class="day-head"><span class="d">' + label +
        '</span><span class="s">' + g.list.length + ' 笔</span></div>' + g.list.map(txnRow).join('') + '</div>';
    }).join('');
  }

  function searchScopeList(scope) {
    let list = db.txns.filter(t => !t.deleted_at);
    if (scope === 'expense' || scope === 'income' || scope === 'transfer') list = list.filter(t => t.type === scope);
    else if (scope === 'loan') list = list.filter(t => t.type === 'loan_out' || t.type === 'loan_in');
    return list.filter(t => matchKw(t, state.kw));
  }
  function searchBodyHtml() {
    const list = searchScopeList(state.searchType);
    let expense = 0, income = 0;
    list.forEach(t => {
      if (t.type === 'expense') expense += ledger.myShare(t, db.splits);
      if (t.type === 'income') income += Math.abs(t.amount_cents);
    });
    const sum = list.length ? ' · 支出 ' + yuan(expense) + ' · 收入 ' + yuan(income) : '';
    return '<div class="hint" style="padding:0 12px 8px">' +
      (state.kw ? '找到 ' + list.length + ' 笔' : '全部账单 ' + list.length + ' 笔') + sum + '</div>' +
      groupedListHtml(list, { empty: state.kw ? '没有找到「' + state.kw + '」相关账单' : '还没有任何账单' });
  }

  function viewSearch() {
    const scopes = [['all', '全部'], ['expense', '支出'], ['income', '收入'], ['transfer', '转账'], ['loan', '借出借入']];
    return '<div class="search-head"><div class="back" data-act="back">‹</div>' +
      '<div class="box"><span class="ic">🔍</span>' +
      '<input id="q" data-act="searchKw" value="' + esc(state.kw) + '" autocomplete="off" ' +
      'placeholder="分类、备注、对方、金额"></div>' +
      '<span style="font-size:12px;color:#9AA3AF;padding:4px;cursor:pointer" data-act="clearKw">清空</span>' +
      '</div>' +
      '<div class="chips" style="padding:0 12px 10px">' + scopes.map(s =>
        '<div class="chip ' + (state.searchType === s[0] ? 'on' : '') + '" data-act="searchScope" data-type="' + s[0] + '">' + s[1] + '</div>').join('') +
      '</div>' +
      '<div id="search-body">' + searchBodyHtml() + '</div>';
  }

  function catTotal(list, type) {
    return list.reduce((s, t) => s + (type === 'expense' ? ledger.myShare(t, db.splits) : Math.abs(t.amount_cents)), 0);
  }
  function categoryAll(id, type) {
    return db.txns.filter(t => {
      if (t.deleted_at || t.type !== type) return false;
      if (id === 'unknown') return !t.category_id || !db.categories.some(c => c.id === t.category_id);
      return t.category_id === id;
    });
  }
  function catBodyHtml() {
    const type = state.params.type === 'income' ? 'income' : 'expense';
    const list = categoryAll(state.params.id, type).filter(t => matchKw(t, state.catKw));
    const head = state.catKw ? '匹配 ' + list.length + ' 笔 · ' : '共 ' + list.length + ' 笔 · ';
    return '<div class="hint" style="padding:0 12px 8px">' + head + '合计 ' + yuan(catTotal(list, type)) + '</div>' +
      groupedListHtml(list, { empty: state.catKw ? '没有匹配的账单' : '这个分类还没有账单' });
  }
  function viewCategory() {
    const type = state.params.type === 'income' ? 'income' : 'expense';
    const id = state.params.id || 'unknown';
    const cat = db.categories.find(c => c.id === id) || { name: '未分类', icon: '📦' };
    const all = categoryAll(id, type);
    const total = catTotal(all, type);
    const typeTotal = catTotal(db.txns.filter(t => !t.deleted_at && t.type === type), type);
    const monthTotal = catTotal(all.filter(t => periodOf(t.occurred_at) === curPeriod()), type);
    const share = typeTotal > 0 ? (Math.round((total / typeTotal) * 1000) / 10).toFixed(1) + '%' : '—';
    return topbar(cat.name, true) +
      '<div class="card head-card"><div class="k">' + (type === 'income' ? '收入分类' : '支出分类') + ' · ' + all.length + ' 笔</div>' +
      '<div class="v num">' + cat.icon + ' ' + yuan(total) + '</div>' +
      '<div style="font-size:11px;color:#9AA3AF;margin-top:8px">占全部' + (type === 'income' ? '收入' : '支出') + ' ' + share +
      ' · 本月 ' + yuan(monthTotal) + '</div></div>' +
      '<div class="search-bar"><span class="ic">🔍</span>' +
      '<input id="cat-q" data-act="catKw" value="' + esc(state.catKw) + '" autocomplete="off" placeholder="搜备注、对方、账户、金额"></div>' +
      '<div id="cat-body">' + catBodyHtml() + '</div>';
  }

  // ========== 视图：记一笔 ==========

        (k === 'back' ? '⌫' : k) + '</div>').join('') +
      '</div><div class="ok' + saveCls + '" data-act="saveTxn">保存</div></div>';
  }

  function safeParse(text) {
    try { return parseYuan(text); } catch (e) { return 0; }
  }

  function splitSelected() {
    return (state.draft ? state.draft.splits : []).filter(s => s.checked);
  }
  function splitParts() {
    const d = state.draft;
    const total = safeParse(d.amountText);
    const sel = splitSelected();
    if (!sel.length || total <= 0) return null;
    const weights = [1].concat(sel.map(s => s.shares));
    return ledger.allocateShares(total, weights, 0);
  }
  function splitSummaryText() {
    const parts = splitParts();
    if (!parts) return '已选 ' + splitSelected().length + ' 人';
    return '我的份额 ' + yuan(parts[0]);
  }

  // ========== 视图：详情 ==========
  function viewDetail() {
    const txn = db.txns.find(t => t.id === state.params.id);
    if (!txn) {
      return topbar('账单详情', true) + '<div class="empty-inline">这笔账不存在或已删除</div>';
    }
    const splits = db.splits.filter(s => s.transaction_id === txn.id);
    const rows = [];
    rows.push(['类型', TYPE_LABELS[txn.type] || txn.type]);
    rows.push(['金额', yuan(txn.amount_cents)]);
    if (txn.category_id) rows.push(['分类', catOf(txn.category_id).icon + ' ' + catOf(txn.category_id).name]);
    rows.push(['账户', accOf(txn.account_id).name]);
    if (txn.to_account_id) rows.push(['转入账户', accOf(txn.to_account_id).name]);
    if (txn.person_id) rows.push([txn.type === 'expense' ? '报销对象' : '往来对象', perOf(txn.person_id).name]);
    const isLoan = txn.type === 'loan_out' || txn.type === 'loan_in';
    const repaid = isLoan ? ledger.loanRepaid(txn, db.settlements) : 0;
    const outstanding = isLoan ? ledger.loanOutstanding(txn, db.settlements) : 0;
    if (isLoan) {
      rows.push(['还款状态', outstanding === 0 ? '已还清'
        : (repaid > 0 ? '已还 ' + yuan(repaid) + '，未还 ' + yuan(outstanding) : '未还 ' + yuan(outstanding))]);
    }
    if (txn.type === 'expense') {
      rows.push(['报销状态', txn.reimburse_status === 'pending' ? '待报销' : (txn.reimburse_status === 'done' ? '已报销' : '不报销')]);
    }
    rows.push(['日期', fmtDate(txn.occurred_at)]);
    rows.push(['备注', txn.note || '—']);
    rows.push(['记录时间', fmtDT(txn.created_at)]);

    const amountCls = txn.type === 'income' ? 'green' : (txn.type === 'expense' ? '' : 'muted');
    const splitRows = splits.length
      ? '<div class="card"><div class="section-head"><span class="section-title">分摊明细</span></div>' +
      splits.map(s => '<div class="row"><span class="k">' + esc(perOf(s.person_id).name) + '</span>' +
        '<span class="v">' + (s.direction === 'we_owe' ? '我欠 TA ' : 'TA 欠我 ') + yuan(s.share_cents) + '</span></div>').join('') +
      '</div>'
      : '';

    return topbar('账单详情', true) +
      '<div class="card head-card"><div class="k">' + (TYPE_LABELS[txn.type] || '') + '</div>' +
      '<div class="v num ' + amountCls + '">' + signedYuan(txn.amount_cents, txn.type) + '</div></div>' +
      '<div class="card"><div class="row-list">' +
      rows.map(r => '<div class="row"><span class="k">' + r[0] + '</span><span class="v">' + esc(r[1]) + '</span></div>').join('') +
      '</div></div>' + splitRows +
      (txn.type === 'expense' && txn.reimburse_status === 'pending' && txn.person_id
        ? '<div style="padding:4px 12px"><div class="btn primary" style="height:44px;line-height:44px" data-act="openReimburse" data-id="' + txn.id + '" data-amount="' + ledger.myShare(txn, db.splits) + '">报销到账</div></div>'
        : '') +
      (isLoan && outstanding > 0
        ? '<div style="padding:4px 12px"><div class="btn primary" style="height:44px;line-height:44px" data-act="openLoanRepay" data-id="' + txn.id + '">' +
          (txn.type === 'loan_out' ? '确认收回（TA 已还款）' : '确认还款（我已还 TA）') + '</div></div>'
        : '') +
      '<div style="display:flex;gap:10px;padding:4px 12px">' +
      '<div class="btn ghost" style="flex:1;width:auto" data-act="editTxn" data-id="' + txn.id + '">编辑</div>' +
      '<div class="btn small" style="flex:1;height:46px;line-height:46px;background:#FDECEA;color:#D9553F" data-act="deleteTxn" data-id="' + txn.id + '">删除</div>' +
      '</div>';
  }

  // ========== 视图：统计 ==========
  function viewStats() {
    const p = state.period;
    let current, ranges;
    if (state.statsMode === 'month') {
      current = monthRange(p);
      ranges = [];
      for (let i = 5; i >= 0; i--) {
        const q = shiftPeriod(p, -i);
        const r = monthRange(q);
        ranges.push({ period: q, start: r.start, end: r.end });
      }
    } else {
      const y = Number(p.slice(0, 4));
      current = yearRange(y);
      ranges = [];
      for (let m = 1; m <= 12; m++) {
        const q = y + '-' + pad2(m);
        const r = monthRange(q);
        ranges.push({ period: q, start: r.start, end: r.end });
      }
    }
    const includePending = db.settings.pendingIncluded;
    const cur = txnsIn(current.start, current.end);
    const expense = ledger.sumExpense(cur, db.splits, { includePending });
    const income = ledger.sumIncome(cur);
    const rate = ledger.savingRate(income, expense);
    const expenseList = ledger.byCategory(cur, db.splits, db.categories, 'expense', { includePending });
    const incomeList = ledger.byCategory(cur, db.splits, db.categories, 'income', { includePending });
    const trend = ranges.map(r => {
      const ts = txnsIn(r.start, r.end);
      return {
        label: Number(r.period.slice(5)) + '月',
        expense: ledger.sumExpense(ts, db.splits, { includePending }),
        income: ledger.sumIncome(ts)
      };
    });

    let budgets = [];
    if (state.statsMode === 'month') {
      const usedByCat = {};
      cur.forEach(t => {
        if (t.type !== 'expense') return;
        if (!includePending && t.reimburse_status === 'pending') return;
        const k = t.category_id || 'unknown';
        usedByCat[k] = (usedByCat[k] || 0) + ledger.myShare(t, db.splits);
      });
      budgets = db.budgets.filter(b => b.period === p).map(b => {
        const isTotal = !b.category_id;
        const used = isTotal ? expense : (usedByCat[b.category_id] || 0);
        const percent = b.amount_cents > 0 ? Math.round((used / b.amount_cents) * 1000) / 10 : 0;
        return {
          id: b.id,
          category_id: b.category_id || null,
          name: isTotal ? '总预算' : catOf(b.category_id).name,
          icon: isTotal ? '🎯' : catOf(b.category_id).icon,
          budget_cents: b.amount_cents,
          used_cents: used,
          percent,
          over: used > b.amount_cents,

  // ========== 图表绘制 ==========
  function canvasCtx(id) {
    const cv = document.getElementById(id);
    if (!cv) return null;
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth;
    const h = cv.clientHeight;
    if (!w || !h) return null;
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    return { ctx, w, h };
  }

  function drawRing(id, items) {
    const c = canvasCtx(id);
    if (!c) return;
    const { ctx, w, h } = c;
    const cx = w / 2, cy = h / 2;
    const radius = Math.min(w, h) / 2 - 14;
    let angle = -Math.PI / 2;
    items.forEach(item => {
      const sweep = (item.percent / 100) * Math.PI * 2;
      ctx.beginPath();
      ctx.strokeStyle = item.color || '#1F6F5C';
      ctx.lineWidth = 12;
      ctx.arc(cx, cy, radius, angle + 0.004, angle + Math.max(0.004, sweep - 0.004));
      ctx.stroke();
      angle += sweep;
    });
    const total = items.reduce((a, b) => a + b.amount_cents, 0);
    ctx.fillStyle = '#1F2329';
    ctx.font = '600 14px -apple-system, "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(yuan(total), cx, cy - 6);
    ctx.fillStyle = '#9AA3AF';
    ctx.font = '11px -apple-system, "PingFang SC", sans-serif';
    ctx.fillText('合计', cx, cy + 13);
  }

  function drawTrend() {
    const c = canvasCtx('trend-chart');
    if (!c || !state.stats) return;
    const { ctx, w, h } = c;
    const items = state.stats.trend;
    const padBottom = 22;
    const chartH = h - padBottom - 6;
    const max = Math.max(1, ...items.map(i => Math.max(i.expense, i.income)));
    const groupW = w / items.length;
    const barW = Math.max(4, Math.min(12, groupW / 4));

    ctx.strokeStyle = '#EDEFF2';
    ctx.beginPath();
    ctx.moveTo(0, h - padBottom);
    ctx.lineTo(w, h - padBottom);
    ctx.stroke();

    items.forEach((item, i) => {
      const x = groupW * i + groupW / 2;
      const eh = (item.expense / max) * chartH;
      const ih = (item.income / max) * chartH;
      ctx.fillStyle = '#1F2329';
      ctx.fillRect(x - barW - 2, h - padBottom - eh, barW, eh);
      ctx.fillStyle = '#1F9D55';
      ctx.fillRect(x + 2, h - padBottom - ih, barW, ih);
      ctx.fillStyle = '#9AA3AF';
      ctx.font = '10px -apple-system, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(item.label, x, h - 7);
    });
  }

  function drawCharts() {
    requestAnimationFrame(() => {
      if (!state.stats) return;
      if (state.stats.expenseList.length) drawRing('ring-expense', state.stats.expenseList);
      if (state.stats.incomeList.length) drawRing('ring-income', state.stats.incomeList);
      if (state.statsMode === 'month') drawTrend();
    });
  }

  const PERSON_KIND_LABELS = { family: '家人', colleague: '同事', friend: '朋友', company: '公司' };

  // ========== 视图：某人 ==========
  function viewPersonDetail() {
    const person = db.persons.find(p => p.id === state.params.id);
    if (!person) return topbar('往来详情', true) + '<div class="empty-inline">对象不存在</div>';
    const balances = ledger.personBalances(db.persons, db.txns, db.splits, db.settlements);
    const balance = balances[person.id] || 0;
    const tone = balance > 0 ? 'green' : (balance < 0 ? 'red' : 'muted');

    const splitMap = {};
    db.splits.filter(s => s.person_id === person.id).forEach(s => { splitMap[s.transaction_id] = s; });
    const related = db.txns.filter(t => !t.deleted_at &&
      (t.person_id === person.id || splitMap[t.id]));
    const rows = [];

    related.forEach(t => {
      let value = Math.abs(t.amount_cents);
      let title = TYPE_LABELS[t.type] || t.type;
      let cls = '';
      let out = 0;
      let repayLabel = '';
      if (t.type === 'loan_out') title = '借出', cls = 'green';
      if (t.type === 'loan_in') title = '借入', cls = 'red';
      if (t.type === 'loan_out' || t.type === 'loan_in') {
        out = ledger.loanOutstanding(t, db.settlements);
        repayLabel = t.type === 'loan_out' ? '确认收回' : '确认还款';
      }
      if (t.type === 'expense' && splitMap[t.id]) {
        value = splitMap[t.id].share_cents;
        title = splitMap[t.id].direction === 'we_owe' ? 'TA 替我垫付' : '分摊（TA 应承担）';
        cls = splitMap[t.id].direction === 'we_owe' ? 'red' : 'green';
      } else if (t.type === 'expense' && t.reimburse_status) {
        title = t.reimburse_status === 'pending' ? '待报销' : '已报销';
        cls = 'green';
      }
      rows.push({
        key: t.id, date: t.occurred_at, title, sub: t.note || '',
        amount: value, cls, pending: t.type === 'expense' && t.reimburse_status === 'pending',
        out, repayLabel
      });
    });

    db.settlements.filter(s => !s.deleted_at && s.person_id === person.id).forEach(s => {
      rows.push({
        key: s.id, date: s.occurred_at,
        title: s.txn_id ? (s.direction === 'in' ? '收到还款' : '归还借款') : (s.direction === 'in' ? '收到结算' : '付出结算'),
        sub: s.note || '', amount: s.amount_cents, cls: 'muted'
      });
    });

    rows.sort((a, b) => b.date - a.date);

    return topbar(person.name, true) +
      '<div class="card head-card"><div class="k">' + (balance > 0 ? 'TA 欠我' : (balance < 0 ? '我欠 TA' : '已结清')) + '</div>' +
      '<div class="v num ' + tone + '">' + yuan(Math.abs(balance)) + '</div>' +
      (balance !== 0 ? '<div style="margin-top:12px"><span class="mini-btn" style="padding:6px 22px;font-size:13px;color:#1F6F5C;border-color:#1F6F5C" data-act="openSettle" data-id="' + person.id + '">结清</span></div>' : '') +
      '</div>' +
      '<div class="card"><div class="section-head"><span class="section-title">流水</span></div>' +
      (rows.length ? rows.map(r =>
        '<div class="field field-row"><div class="grow" style="min-width:0"><div style="font-size:13px">' + esc(r.title) + '</div>' +
        '<div style="font-size:11px;color:#9AA3AF">' + fmtDate(r.date) + (r.sub ? ' · ' + esc(r.sub) : '') + '</div></div>' +
        '<div style="text-align:right"><div class="num ' + r.cls + '" style="font-weight:600">' + yuan(r.amount) + '</div>' +
        (r.pending ? '<span class="mini-btn" style="margin-top:4px" data-act="openReimburse" data-id="' + r.key + '" data-amount="' + r.amount + '">报销到账</span>' : '') +
        (r.out > 0 ? '<span class="mini-btn" style="margin-top:4px" data-act="openLoanRepay" data-id="' + r.key + '">' + r.repayLabel + '</span>' : '') +
        (r.out === 0 && r.repayLabel ? '<div style="font-size:11px;color:#1F9D55;margin-top:2px">已还清</div>' : '') +
        '</div></div>').join('') : '<div class="empty-inline">还没有往来记录</div>') +
      '</div>';
  }
